name: Reconcile EduNizam Supabase Migration History

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/reconcile-supabase-migrations.yml"

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    env:
      SUPABASE_PROJECT_ID: qmdiexentozvhhfjvlmr
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: Require Supabase deployment secrets
        shell: bash
        run: |
          missing=0
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Missing repository secret SUPABASE_ACCESS_TOKEN"
            missing=1
          elif [[ ! "$SUPABASE_ACCESS_TOKEN" =~ ^sbp_[A-Za-z0-9]+$ ]]; then
            echo "::error::SUPABASE_ACCESS_TOKEN must be a Supabase personal access token beginning with sbp_."
            missing=1
          fi
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Missing repository secret SUPABASE_DB_PASSWORD"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then exit 1; fi

      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Mark verified production migrations as applied
        shell: bash
        run: |
          versions=(
            20261006063500
            20261006065000
            20261006070500
            20261006072000
            20261006083000
            20261006084500
            20261006090000
            20261006091500
            20261006093000
            20261006094500
            20261006100000
            20261006101500
            20261006121500
            20261006123000
            20261006124500
            20261006130000
          )
          supabase migration repair "${versions[@]}" --status applied

      - name: Verify local and remote migration history
        run: supabase migration list

      - name: Prove no database migration replay is pending
        shell: bash
        run: |
          output="$(supabase db push --dry-run 2>&1)"
          printf '%s\n' "$output"
          if ! grep -q "Remote database is up to date" <<<"$output"; then
            echo "::error::Supabase still reports pending migrations after history reconciliation."
            exit 1
          fi
