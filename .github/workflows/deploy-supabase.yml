name: Deploy EduNizam Supabase

on:
  workflow_dispatch:

permissions:
  contents: read

# Serialize production deploys; never cancel a migration push mid-flight.
concurrency:
  group: edunizam-production-supabase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Project ref is public and comes from:
      # https://qmdiexentozvhhfjvlmr.supabase.co
      SUPABASE_PROJECT_ID: qmdiexentozvhhfjvlmr
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: Require Supabase deployment secrets
        shell: bash
        run: |
          missing=0
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Missing repository secret SUPABASE_ACCESS_TOKEN"
            missing=1
          elif [[ ! "$SUPABASE_ACCESS_TOKEN" =~ ^sbp_[A-Za-z0-9]+$ ]]; then
            echo "::error::SUPABASE_ACCESS_TOKEN must be a Supabase personal access token beginning with sbp_. A publishable/anon project key will not work."
            missing=1
          fi
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Missing repository secret SUPABASE_DB_PASSWORD"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "Add the missing secrets in GitHub repository Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "Supabase deployment credentials look valid."

      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      # Remote-only rows mean production has applied migration versions whose
      # SQL files are absent locally. Stop rather than pushing into uncertain
      # history; do not use migration repair/include-all as an automatic fix.
      - name: Block deployment when remote migration history is unreconciled
        shell: bash
        run: |
          set -euo pipefail
          supabase migration list --linked | tee /tmp/supabase-migration-list.txt

          if ! grep -q 'LOCAL.*REMOTE' /tmp/supabase-migration-list.txt; then
            echo "::error::Could not recognize Supabase migration-list output; refusing deployment."
            exit 1
          fi

          if awk -F '│' '
            NF >= 3 {
              local_version = $1
              remote_version = $2
              gsub(/[[:space:]]/, "", local_version)
              gsub(/[[:space:]]/, "", remote_version)
              if (local_version == "" && length(remote_version) == 14 && remote_version ~ /^[0-9]+$/) {
                print "Remote-only migration history entry: " remote_version
                found = 1
              }
            }
            END { exit found ? 0 : 1 }
          ' /tmp/supabase-migration-list.txt; then
            echo "::error::Production has remote-only migration versions with no matching local SQL. Reconcile from an authoritative source before deployment."
            exit 1
          fi

      - name: Preview pending database migrations
        run: supabase db push --dry-run

      - name: Apply database migrations
        run: supabase db push

      - name: Deploy EduNizam edge functions
        shell: bash
        run: |
          for fn in supabase/functions/*; do
            [ -d "$fn" ] || continue
            name="$(basename "$fn")"
            echo "Deploying function: $name"
            supabase functions deploy "$name" --project-ref "$SUPABASE_PROJECT_ID"
          done
