name: Configure EduNizam Auth Email

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    env:
      PROJECT_REF: qmdiexentozvhhfjvlmr
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SMTP_HOST: smtp-relay.brevo.com
      SMTP_PORT: "587"
      SMTP_USER: ${{ secrets.EDUNIZAM_SMTP_USER }}
      SMTP_PASS: ${{ secrets.EDUNIZAM_SMTP_PASS }}
      SMTP_FROM_EMAIL: ${{ secrets.EDUNIZAM_SMTP_FROM_EMAIL }}
      SMTP_SENDER_NAME: EduNizam

    steps:
      - name: Validate required secrets
        shell: bash
        run: |
          missing=0
          for key in SUPABASE_ACCESS_TOKEN SMTP_USER SMTP_PASS SMTP_FROM_EMAIL; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing required GitHub secret for ${key}"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi
          if [[ ! "$SUPABASE_ACCESS_TOKEN" =~ ^sbp_ ]]; then
            echo "::error::SUPABASE_ACCESS_TOKEN must be a Supabase personal access token."
            exit 1
          fi
          echo "Required secrets are present."

      - name: Configure SMTP and OTP email templates
        shell: bash
        run: |
          jq -n             --arg host "$SMTP_HOST"             --arg port "$SMTP_PORT"             --arg user "$SMTP_USER"             --arg pass "$SMTP_PASS"             --arg from "$SMTP_FROM_EMAIL"             --arg sender "$SMTP_SENDER_NAME"             '{
              external_email_enabled: true,
              mailer_autoconfirm: false,
              mailer_secure_email_change_enabled: true,
              smtp_admin_email: $from,
              smtp_host: $host,
              smtp_port: $port,
              smtp_user: $user,
              smtp_pass: $pass,
              smtp_sender_name: $sender,
              mailer_subjects_confirmation: "EduNizam email verification code",
              mailer_templates_confirmation_content: "<h2>Verify your EduNizam account</h2><p>Your 6-digit verification code is:</p><p style=\"font-size:28px;font-weight:700;letter-spacing:5px\">{{ .Token }}</p><p>Enter this code in EduNizam. You can also use this secure link:</p><p><a href=\"{{ .ConfirmationURL }}\">Verify email</a></p><p>If you did not create this account, ignore this email.</p>",
              mailer_subjects_recovery: "EduNizam password reset code",
              mailer_templates_recovery_content: "<h2>Reset your EduNizam password</h2><p>Your 6-digit recovery code is:</p><p style=\"font-size:28px;font-weight:700;letter-spacing:5px\">{{ .Token }}</p><p>Enter this code in EduNizam to set a new password. You can also use this secure link:</p><p><a href=\"{{ .ConfirmationURL }}\">Reset password</a></p><p>If you did not request a password reset, ignore this email.</p>"
            }' > auth-config.json

          curl --fail-with-body --silent --show-error             -X PATCH "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth"             -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN"             -H "Content-Type: application/json"             --data-binary @auth-config.json >/tmp/auth-update.json

          echo "Supabase Auth SMTP and OTP templates updated."

      - name: Verify non-secret Auth settings
        shell: bash
        run: |
          curl --fail --silent --show-error             "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth"             -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN"             | jq '{
                external_email_enabled,
                mailer_autoconfirm,
                mailer_secure_email_change_enabled,
                smtp_host,
                smtp_port,
                smtp_admin_email,
                smtp_sender_name,
                mailer_subjects_confirmation,
                mailer_subjects_recovery
              }'
