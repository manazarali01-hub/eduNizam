name: Repository Smoke Checks

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Run EduNizam smoke checks
        run: node scripts/repo-smoke-check.mjs

      - name: Validate reference-data completeness
        run: node scripts/data-completion-check.mjs

      - name: Validate paper-builder marks and dynamic school data
        run: node scripts/paper-builder-data-check.mjs

      - name: Verify school data readiness audit and grade catalog
        run: node scripts/school-data-readiness-check.mjs
