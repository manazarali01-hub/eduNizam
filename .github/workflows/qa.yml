name: EduNizam QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run EduNizam QA
        run: node qa-check.mjs

  browser-layout:
    runs-on: ubuntu-latest
    needs: static-qa
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install pinned Playwright runtime outside the repository
        shell: bash
        run: |
          rm -rf /tmp/edunizam-pw
          npm install --prefix /tmp/edunizam-pw --no-save playwright@1.55.0
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -n "$CHROME" ]; then
            echo "EDUNIZAM_BROWSER=$CHROME" >> "$GITHUB_ENV"
          else
            node /tmp/edunizam-pw/node_modules/playwright/cli.js install --with-deps chromium
          fi
          echo "PLAYWRIGHT_MODULE=file:///tmp/edunizam-pw/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
      - name: Run rendered mobile/layout regression checks
        run: node scripts/browser-layout-check.mjs
