name: Deploy EduNizam to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Use a versioned group so an orphaned legacy "pages" run cannot block new deploys.
  # Only the newest deployment for this ref matters; stale runs should yield immediately.
  group: "edunizam-pages-v2-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment_retry.outputs.page_url || steps.deployment_primary.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Run repository smoke checks
        run: node scripts/repo-smoke-check.mjs

      - name: Run EduNizam QA gate
        run: node qa-check.mjs

      - name: Block incomplete curriculum/question catalog
        run: node scripts/data-completion-check.mjs


      - name: Gate real question paper marks and school dropdowns
        run: node scripts/paper-builder-data-check.mjs

      - name: Verify Practice Next Previous navigation and answer persistence
        run: node scripts/practice-navigation-check.mjs

      - name: Verify institution dependent class student and staff dropdown options
        run: node scripts/school-dependent-dropdown-check.mjs

      - name: Verify Student Parent Teacher and Admin profile isolation
        run: node scripts/profile-role-visibility-check.mjs

      - name: Verify class-section student pickers and authorized form submission
        run: node scripts/student-form-picker-check.mjs

      - name: Verify school data readiness audit and grade catalog
        run: node scripts/school-data-readiness-check.mjs

      - name: Verify cloud-first student staff and class bulk imports
        run: node scripts/bulk-import-cloud-check.mjs

      - name: Install pinned Playwright runtime for interaction gate
        shell: bash
        run: |
          rm -rf /tmp/edunizam-pw
          npm install --prefix /tmp/edunizam-pw --no-save playwright@1.55.0
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -n "$CHROME" ]; then
            echo "EDUNIZAM_BROWSER=$CHROME" >> "$GITHUB_ENV"
          else
            node /tmp/edunizam-pw/node_modules/playwright/cli.js install --with-deps chromium
          fi
          echo "PLAYWRIGHT_MODULE=file:///tmp/edunizam-pw/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"

      - name: Build optimized CC0 clay icon assets
        shell: bash
        run: |
          python3 -m pip install --quiet pillow
          python3 scripts/build-clay-icons.py
      - name: Block deployment if rendered login/mobile interaction regresses
        run: node scripts/browser-layout-check.mjs

      - name: Block deployment if Teacher Student Parent workflows regress
        run: node scripts/role-workflow-check.mjs

      - name: Check latest main commit
        id: latest
        shell: bash
        run: |
          LATEST_SHA="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          echo "Remote main: ${LATEST_SHA}"
          echo "This run:    ${GITHUB_SHA}"
          if [[ "${LATEST_SHA}" == "${GITHUB_SHA}" ]]; then
            echo "deploy=true" >> "${GITHUB_OUTPUT}"
          else
            echo "deploy=false" >> "${GITHUB_OUTPUT}"
            echo "Stale workflow run detected; deployment steps will be skipped."
          fi

      - name: Configure GitHub Pages
        if: steps.latest.outputs.deploy == 'true'
        uses: actions/configure-pages@v5

      - name: Upload static site
        if: steps.latest.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment_primary
        if: steps.latest.outputs.deploy == 'true'
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Pause before Pages retry
        if: steps.latest.outputs.deploy == 'true' && steps.deployment_primary.outcome == 'failure'
        run: sleep 15

      - name: Retry GitHub Pages deployment
        id: deployment_retry
        if: steps.latest.outputs.deploy == 'true' && steps.deployment_primary.outcome == 'failure'
        uses: actions/deploy-pages@v5

      - name: Verify live EduNizam deployment
        if: steps.latest.outputs.deploy == 'true'
        shell: bash
        run: |
          BASE="${{ steps.deployment_retry.outputs.page_url || steps.deployment_primary.outputs.page_url }}"
          BASE="${BASE%/}/"
          echo "Checking ${BASE}"

          check_content() {
            local url="$1"
            local marker="$2"
            for attempt in 1 2 3 4 5 6; do
              body="$(curl --fail --silent --show-error --location -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' "${url}?verify=${GITHUB_SHA}-${attempt}" || true)"
              if [[ "${body}" == *"${marker}"* ]]; then
                return 0
              fi
              echo "Attempt ${attempt}: expected content not live yet at ${url}"
              sleep 5
            done
            return 1
          }

          check_content "${BASE}" "EduNizam"
          check_content "${BASE}login.html" "EduNizam Login"
          check_content "${BASE}sitemap.xml" "<urlset"
          check_content "${BASE}robots.txt" "Sitemap:"
          check_content "${BASE}manifest.webmanifest" "icon-512.png"
          check_content "${BASE}pwa-install.js" "beforeinstallprompt"

          verify_exact_file() {
            local rel="$1"
            local out="/tmp/live-$(basename "${rel}")"
            for attempt in 1 2 3 4 5 6; do
              if curl --fail --silent --show-error --location \
                --retry 2 --retry-delay 1 \
                -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' \
                "${BASE}${rel}?verify=${GITHUB_SHA}-${attempt}" -o "${out}"; then
                if cmp -s "${rel}" "${out}"; then
                  echo "Exact live file verified: ${rel}"
                  return 0
                fi
                echo "Attempt ${attempt}: live content differs: ${rel}"
              else
                echo "Attempt ${attempt}: live file temporarily unavailable: ${rel}"
              fi
              sleep 2
            done
            echo "Live file could not be verified: ${rel}"
            sha256sum "${rel}" "${out}" || true
            return 1
          }

          for rel in *.html; do
            verify_exact_file "$rel"
          done
          verify_exact_file "app.js"
          verify_exact_file "mobile-nav-core.js"
          verify_exact_file "navigation-enhancements.js"
          verify_exact_file "data-runtime.js"
          verify_exact_file "auth-bridge.js"
          verify_exact_file "admissions-cloud.js"
          verify_exact_file "core-cloud.js"
          verify_exact_file "reliability-guardian.js"
          verify_exact_file "role-access-center.js"
          verify_exact_file "academic-access.js"
          verify_exact_file "cloud-setup.js"
          verify_exact_file "feature-loader.js"
          verify_exact_file "role-scope.js"
          verify_exact_file "attendance-analytics.js"
          verify_exact_file "leave-center.js"
          verify_exact_file "parent-complaint-center.js"
          verify_exact_file "daily-class-diary.js"
          verify_exact_file "teacher-paper-builder.js"
          verify_exact_file "premium-ui.css"
          verify_exact_file "edunizam-visual-system.css"
          verify_exact_file "home-showcase.css"
          verify_exact_file "home-mobile-200-clarity-oct08.css"
          verify_exact_file "premium-ui.js"
          verify_exact_file "edunizam-colorful-icons.js"
          verify_exact_file "edunizam-colorful-icons.css"
          verify_exact_file "premium-form-fields.css"
          verify_exact_file "sw.js"
          verify_exact_file "pwa-install.js"
          verify_exact_file "system-auto-update.js"
          verify_exact_file "guest-learning-premium.js"
          verify_exact_file "guest-learning-nav.js"
          # Verify actual clay renders, not only the loader script.
          test "$(find assets/icons -name 'clay-*.webp' -type f | wc -l)" -eq 48
          for rel in assets/icons/clay-*.webp; do
            verify_exact_file "$rel"
          done
          verify_exact_file "assets/icons/LICENSE.txt"

          curl --fail --silent --show-error --location "${BASE}icon-192.png?verify=${GITHUB_SHA}" -o /tmp/icon-192.png
          curl --fail --silent --show-error --location "${BASE}icon-512.png?verify=${GITHUB_SHA}" -o /tmp/icon-512.png
          file /tmp/icon-192.png | grep -q "PNG image data, 192 x 192"
          file /tmp/icon-512.png | grep -q "PNG image data, 512 x 512"
          echo "Sitemap headers:"
          curl --fail --silent --show-error --location --head -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' "${BASE}sitemap.xml?verify=${GITHUB_SHA}" | sed -n '1,20p'
          echo "Live deployment verification passed."
