name: Deploy EduNizam to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Run repository smoke checks
        run: node scripts/repo-smoke-check.mjs

      - name: Run EduNizam QA gate
        run: node qa-check.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Verify live EduNizam deployment
        shell: bash
        run: |
          BASE="${{ steps.deployment.outputs.page_url }}"
          echo "Checking ${BASE}"
          curl --fail --silent --show-error --location --retry 6 --retry-delay 5 "${BASE}" | grep -q "EduNizam"
          curl --fail --silent --show-error --location --retry 6 --retry-delay 5 "${BASE}login.html" | grep -q "EduNizam Login"
          curl --fail --silent --show-error --location --retry 6 --retry-delay 5 "${BASE}app.js" >/dev/null
          echo "Live deployment verification passed."
