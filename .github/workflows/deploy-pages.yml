name: Deploy EduNizam to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment_retry.outputs.page_url || steps.deployment_primary.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Run repository smoke checks
        run: node scripts/repo-smoke-check.mjs

      - name: Run EduNizam QA gate
        run: node qa-check.mjs

      - name: Check latest main commit
        id: latest
        shell: bash
        run: |
          LATEST_SHA="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          echo "Remote main: ${LATEST_SHA}"
          echo "This run:    ${GITHUB_SHA}"
          if [[ "${LATEST_SHA}" == "${GITHUB_SHA}" ]]; then
            echo "deploy=true" >> "${GITHUB_OUTPUT}"
          else
            echo "deploy=false" >> "${GITHUB_OUTPUT}"
            echo "Stale workflow run detected; deployment steps will be skipped."
          fi

      - name: Configure GitHub Pages
        if: steps.latest.outputs.deploy == 'true'
        uses: actions/configure-pages@v5

      - name: Upload static site
        if: steps.latest.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment_primary
        if: steps.latest.outputs.deploy == 'true'
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Pause before Pages retry
        if: steps.latest.outputs.deploy == 'true' && steps.deployment_primary.outcome == 'failure'
        run: sleep 15

      - name: Retry GitHub Pages deployment
        id: deployment_retry
        if: steps.latest.outputs.deploy == 'true' && steps.deployment_primary.outcome == 'failure'
        uses: actions/deploy-pages@v5

      - name: Verify live EduNizam deployment
        if: steps.latest.outputs.deploy == 'true'
        shell: bash
        run: |
          BASE="${{ steps.deployment_retry.outputs.page_url || steps.deployment_primary.outputs.page_url }}"
          BASE="${BASE%/}/"
          echo "Checking ${BASE}"

          check_content() {
            local url="$1"
            local marker="$2"
            for attempt in 1 2 3 4 5 6; do
              body="$(curl --fail --silent --show-error --location -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' "${url}?verify=${GITHUB_SHA}-${attempt}" || true)"
              if [[ "${body}" == *"${marker}"* ]]; then
                return 0
              fi
              echo "Attempt ${attempt}: expected content not live yet at ${url}"
              sleep 5
            done
            return 1
          }

          check_content "${BASE}" "EduNizam"
          check_content "${BASE}login.html" "EduNizam Login"
          check_content "${BASE}sitemap.xml" "<urlset"
          check_content "${BASE}robots.txt" "Sitemap:"
          check_content "${BASE}manifest.webmanifest" "icon-512.png"
          check_content "${BASE}pwa-install.js" "beforeinstallprompt"
          curl --fail --silent --show-error --location "${BASE}icon-192.png?verify=${GITHUB_SHA}" -o /tmp/icon-192.png
          curl --fail --silent --show-error --location "${BASE}icon-512.png?verify=${GITHUB_SHA}" -o /tmp/icon-512.png
          file /tmp/icon-192.png | grep -q "PNG image data, 192 x 192"
          file /tmp/icon-512.png | grep -q "PNG image data, 512 x 512"
          echo "Sitemap headers:"
          curl --fail --silent --show-error --location --head -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' "${BASE}sitemap.xml?verify=${GITHUB_SHA}" | sed -n '1,20p'
          curl --fail --silent --show-error --location -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' "${BASE}app.js?verify=${GITHUB_SHA}" >/dev/null
          echo "Live deployment verification passed."
