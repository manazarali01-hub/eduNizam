<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" role="img" aria-labelledby="title desc">
<title id="title">EduNizam glowing graduation cap and open book</title><desc id="desc">A polished silver and electric blue graduation cap floating above an illuminated open book, framed by golden laurel leaves and blue light trails.</desc>
<defs>
 <linearGradient id="cap" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset=".18" stop-color="#74eaff"/><stop offset=".48" stop-color="#0878ff"/><stop offset="1" stop-color="#041a68"/></linearGradient>
 <linearGradient id="cloth" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#dffaff"/><stop offset=".3" stop-color="#168bff"/><stop offset="1" stop-color="#06154d"/></linearGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff6bb"/><stop offset=".45" stop-color="#ffce43"/><stop offset="1" stop-color="#a85a08"/></linearGradient>
 <linearGradient id="book" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff"/><stop offset=".35" stop-color="#8feaff"/><stop offset="1" stop-color="#1267d8"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#9ff6ff" stop-opacity=".9"/><stop offset="1" stop-color="#08aaff" stop-opacity="0"/></radialGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
 <filter id="shine" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<ellipse cx="360" cy="360" rx="260" ry="62" fill="#00aaff" opacity=".24" filter="url(#blur)"/>
<path d="M40 360 C150 260 210 420 350 335 S560 270 680 350" fill="none" stroke="#16cfff" stroke-width="8" opacity=".65" filter="url(#shine)"/>
<path d="M60 390 C190 300 230 445 380 360 S560 310 670 385" fill="none" stroke="#f9d36a" stroke-width="3" opacity=".85"/>
<!-- laurel branches -->
<g fill="none" stroke="url(#gold)" stroke-width="5" stroke-linecap="round">
 <path d="M170 330 C95 245 110 135 190 75"/><path d="M550 330 C625 245 610 135 530 75"/>
</g>
<g fill="url(#gold)" stroke="#fff0a7" stroke-width="1.5">
 <path d="M130 265 Q75 248 95 218 Q130 220 130 265 M119 225 Q64 194 91 171 Q124 185 119 225 M122 180 Q83 140 116 123 Q143 150 122 180 M145 135 Q124 92 162 83 Q181 116 145 135 M175 104 Q168 62 207 62 Q218 98 175 104"/>
 <path d="M590 265 Q645 248 625 218 Q590 220 590 265 M601 225 Q656 194 629 171 Q596 185 601 225 M598 180 Q637 140 604 123 Q577 150 598 180 M575 135 Q596 92 558 83 Q539 116 575 135 M545 104 Q552 62 513 62 Q502 98 545 104"/>
</g>
<!-- open book -->
<g filter="url(#shine)">
 <path d="M150 300 Q250 258 355 307 L355 390 Q250 346 150 382Z" fill="url(#book)" stroke="#d8fbff" stroke-width="4"/>
 <path d="M570 300 Q465 258 355 307 L355 390 Q465 346 570 382Z" fill="url(#book)" stroke="#d8fbff" stroke-width="4"/>
 <path d="M355 307 L355 390" stroke="#fff" stroke-width="5"/>
 <path d="M174 319 Q260 292 332 326 M174 340 Q260 313 332 347 M174 360 Q260 333 332 367" fill="none" stroke="#1d75c8" stroke-width="3" opacity=".7"/>
 <path d="M536 319 Q450 292 378 326 M536 340 Q450 313 378 347 M536 360 Q450 333 378 367" fill="none" stroke="#1d75c8" stroke-width="3" opacity=".7"/>
</g>
<!-- graduation cap -->
<ellipse cx="360" cy="190" rx="170" ry="46" fill="url(#glow)" opacity=".85" filter="url(#blur)"/>
<path d="M205 165 L360 92 L515 165 L360 238Z" fill="url(#cap)" stroke="#e8fdff" stroke-width="5" filter="url(#shine)"/>
<path d="M263 188 L360 235 L457 188 L446 235 Q360 282 274 235Z" fill="url(#cloth)" stroke="#b8f5ff" stroke-width="3"/>
<path d="M515 165 L530 245" stroke="url(#gold)" stroke-width="7" stroke-linecap="round"/>
<circle cx="530" cy="248" r="10" fill="url(#gold)" stroke="#fff2bd" stroke-width="3"/>
<path d="M530 257 Q545 275 535 300 Q530 315 545 322" fill="none" stroke="url(#gold)" stroke-width="5"/>
<path d="M545 322 Q555 334 542 342 Q530 335 545 322" fill="url(#gold)"/>
<g fill="#fff"><circle cx="115" cy="100" r="4"/><circle cx="590" cy="120" r="4"/><circle cx="620" cy="290" r="3"/><circle cx="92" cy="310" r="3"/><circle cx="480" cy="52" r="3"/></g>
<g fill="#ffe18a"><path d="M250 58l5 13 13 5-13 5-5 13-5-13-13-5 13-5z"/><path d="M610 180l4 10 10 4-10 4-4 10-4-10-10-4 10-4z"/></g>
</svg>