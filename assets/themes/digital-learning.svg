<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">EduNizam digital learning workspace</title><desc id="desc">A modern blue glass education dashboard with learning progress, subject cards and a student profile.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b3974"/><stop offset=".55" stop-color="#071f49"/><stop offset="1" stop-color="#04132f"/></linearGradient>
 <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff" stop-opacity=".24"/><stop offset="1" stop-color="#8bcaff" stop-opacity=".08"/></linearGradient>
 <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5fbff"/><stop offset="1" stop-color="#dceeff"/></linearGradient>
 <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#39b5ff"/><stop offset="1" stop-color="#1769d2"/></linearGradient>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feGaussianBlur in="SourceAlpha" stdDeviation="18"/><feOffset dy="18"/><feComponentTransfer><feFuncA type="linear" slope=".34"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="900" rx="42" fill="url(#bg)"/>
<circle cx="1000" cy="120" r="250" fill="#1688e8" opacity=".16"/><circle cx="160" cy="780" r="260" fill="#4bc5ff" opacity=".10"/>
<g opacity=".22" stroke="#9bdcff" fill="none"><path d="M0 180H1200M0 720H1200M180 0V900M1020 0V900" stroke-dasharray="5 14"/></g>
<!-- Main glass workspace -->
<g filter="url(#shadow)" transform="translate(130 155)">
 <rect width="900" height="570" rx="34" fill="url(#glass)" stroke="#a9dcff" stroke-opacity=".7" stroke-width="3"/>
 <path d="M0 78Q0 0 78 0H822Q900 0 900 78V90H0Z" fill="#eaf7ff" fill-opacity=".12"/>
 <circle cx="42" cy="43" r="8" fill="#ff8b91"/><circle cx="70" cy="43" r="8" fill="#ffd36d"/><circle cx="98" cy="43" r="8" fill="#6ee2b5"/>
 <text x="140" y="51" fill="#f4fbff" font-family="Arial,sans-serif" font-size="24" font-weight="700">EduNizam</text>
 <rect x="32" y="112" width="190" height="420" rx="22" fill="#061c3c" fill-opacity=".62" stroke="#a9dcff" stroke-opacity=".25"/>
 <rect x="55" y="145" width="142" height="42" rx="12" fill="#248be0" fill-opacity=".75"/>
 <g fill="#d9efff" font-family="Arial,sans-serif" font-size="15"><text x="76" y="172">Overview</text><text x="76" y="229">My classes</text><text x="76" y="286">Assignments</text><text x="76" y="343">Results</text><text x="76" y="400">Learning Hub</text></g>
 <g fill="none" stroke="#9edcff" stroke-width="2" opacity=".8"><rect x="56" y="207" width="16" height="16" rx="4"/><rect x="56" y="264" width="16" height="16" rx="4"/><rect x="56" y="321" width="16" height="16" rx="4"/><rect x="56" y="378" width="16" height="16" rx="4"/></g>
 <text x="260" y="151" fill="#123d68" font-family="Arial,sans-serif" font-size="27" font-weight="700">Your learning, in focus.</text>
 <text x="260" y="181" fill="#54718e" font-family="Arial,sans-serif" font-size="15">A clear view of progress and school life</text>
 <rect x="260" y="205" width="285" height="145" rx="20" fill="url(#screen)"/>
 <text x="284" y="239" fill="#54718e" font-family="Arial,sans-serif" font-size="14">WEEKLY PROGRESS</text>
 <text x="284" y="292" fill="#123d68" font-family="Arial,sans-serif" font-size="42" font-weight="700">82%</text>
 <rect x="284" y="315" width="235" height="10" rx="5" fill="#c5dced"/><rect x="284" y="315" width="193" height="10" rx="5" fill="url(#blue)"/>
 <rect x="565" y="205" width="300" height="145" rx="20" fill="url(#screen)"/>
 <text x="590" y="239" fill="#54718e" font-family="Arial,sans-serif" font-size="14">UPCOMING</text>
 <text x="590" y="279" fill="#123d68" font-family="Arial,sans-serif" font-size="22" font-weight="700">Science practice</text>
 <text x="590" y="309" fill="#54718e" font-family="Arial,sans-serif" font-size="14">Chapter 04 · 12 questions</text>
 <g transform="translate(260 378)">
  <rect width="185" height="125" rx="18" fill="#eaf6ff"/><circle cx="40" cy="40" r="20" fill="#d5ecff"/><path d="M31 40h18M40 31v18" stroke="#1684d5" stroke-width="4" stroke-linecap="round"/><text x="24" y="83" fill="#123d68" font-family="Arial,sans-serif" font-size="17" font-weight="700">Past Papers</text><text x="24" y="105" fill="#54718e" font-family="Arial,sans-serif" font-size="12">Board resources</text>
  <rect x="205" width="185" height="125" rx="18" fill="#eaf6ff"/><circle cx="245" cy="40" r="20" fill="#d5ecff"/><path d="M236 45l9-12 9 12" fill="none" stroke="#1684d5" stroke-width="4" stroke-linecap="round"/><text x="229" y="83" fill="#123d68" font-family="Arial,sans-serif" font-size="17" font-weight="700">Study Tools</text><text x="229" y="105" fill="#54718e" font-family="Arial,sans-serif" font-size="12">Practice &amp; revise</text>
  <rect x="410" width="190" height="125" rx="18" fill="#eaf6ff"/><circle cx="450" cy="40" r="20" fill="#d5ecff"/><path d="M441 40l7 7 12-15" fill="none" stroke="#1684d5" stroke-width="4" stroke-linecap="round"/><text x="434" y="83" fill="#123d68" font-family="Arial,sans-serif" font-size="17" font-weight="700">Results</text><text x="434" y="105" fill="#54718e" font-family="Arial,sans-serif" font-size="12">Track achievement</text>
 </g>
</g>
<!-- Floating glass learning badge -->
<g filter="url(#shadow)" transform="translate(805 95)">
 <rect width="250" height="105" rx="22" fill="#f3faff" fill-opacity=".94" stroke="#b7e2ff" stroke-width="2"/>
 <circle cx="48" cy="52" r="25" fill="#d8efff"/><path d="M34 48l14-8 14 8-14 8zM39 53v10l9 5 9-5V53" fill="none" stroke="#1679c4" stroke-width="3" stroke-linejoin="round"/>
 <text x="86" y="45" fill="#123d68" font-family="Arial,sans-serif" font-size="14" font-weight="700">LEARN ANYWHERE</text><text x="86" y="69" fill="#54718e" font-family="Arial,sans-serif" font-size="13">Guest access included</text>
</g>
<g transform="translate(70 735)"><rect width="250" height="88" rx="20" fill="url(#glass)" stroke="#9bdcff" stroke-opacity=".65"/><text x="25" y="37" fill="#f4fbff" font-family="Arial,sans-serif" font-size="14" font-weight="700">ONE CONNECTED SPACE</text><text x="25" y="62" fill="#c9eaff" font-family="Arial,sans-serif" font-size="13">School · Teachers · Students</text></g>
</svg>